name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `claude/**` as well as main, so that a pull request stacked on another
    # ticket's branch still gets the full matrix. Without it a stacked PR runs
    # no checks at all and reads as "no CI configured" rather than "not run" —
    # which is the failure mode this project is least able to afford.
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: ctype, curl, dom, fileinfo, filter, gd, hash, intl, mbstring, openssl, pdo, pdo_mysql, pdo_sqlite, tokenizer, xml, zip

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.2 is the floor the platform promises to run on, including shared
        # cPanel accounts. 8.4 is where new servers are.
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  database:
    name: DB ${{ matrix.label }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # SQLite is what local development and the default test run use.
          - label: SQLite
            connection: sqlite

          # MySQL 8.0 — the reference engine.
          - label: MySQL 8.0
            connection: mysql
            image: mysql:8.0

          # MariaDB is not an afterthought: cPanel is the primary deployment
          # target and ships MariaDB. 10.6 is the oldest release still widely
          # provisioned, 11.4 the current LTS. The two diverge from MySQL on
          # index key length, CHECK constraints, JSON handling and utf8mb4
          # collations — exactly what the domain model is about to rely on.
          # Driven through Laravel's dedicated `mariadb` connection, which is
          # what a cPanel install uses and which emits MariaDB-correct DDL
          # rather than MySQL DDL that merely happens to parse.
          - label: MariaDB 10.6
            connection: mariadb
            image: mariadb:10.6

          - label: MariaDB 11.4
            connection: mariadb
            image: mariadb:11.4

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Started here rather than through `services:` so that one job can cover
      # both the server-backed engines and SQLite, which has no container.
      - name: Start ${{ matrix.label }}
        if: matrix.image != ''
        run: |
          docker run -d --name sanitube-db \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=sanitube_test \
            -p 3306:3306 \
            ${{ matrix.image }}

          # Probed over TCP from the host, with the credentials the
          # application will use — never with `docker exec ... ping`. During
          # initialisation these images run a temporary server that answers on
          # the container's unix socket with `port: 0`, so a socket ping
          # reports "ready" seconds before TCP is listening and the migrate
          # step then fails against a database that was never up.
          for attempt in $(seq 1 60); do
            if php -r '
              try {
                  new PDO("mysql:host=127.0.0.1;port=3306;dbname=sanitube_test", "root", "root");
                  exit(0);
              } catch (Throwable $e) {
                  exit(1);
              }'; then
              echo "Database accepted a TCP connection after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done

          echo "Database did not become reachable over TCP."
          docker logs sanitube-db
          exit 1

      - name: Prepare SQLite database
        if: matrix.connection == 'sqlite'
        run: |
          mkdir -p database
          touch database/ci.sqlite

      - name: Migrate, test, roll back, migrate again
        env:
          DB_CONNECTION: ${{ matrix.connection }}
          DB_DATABASE: ${{ matrix.connection == 'sqlite' && 'database/ci.sqlite' || 'sanitube_test' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --force
          php artisan test
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Collect database logs on failure
        if: failure() && matrix.image != ''
        run: docker logs sanitube-db

  lint:
    name: Code style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check formatting
        run: vendor/bin/pint --test

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Analyse
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run types

      # Component behaviour that PHP cannot reach: focus trapping, Escape,
      # scroll locking, and the listener cleanup that only shows up across a
      # remount. `role="dialog" aria-modal="true"` is a promise, and this is
      # where it is checked.
      - name: Component tests
        run: npm run test

      - name: Build
        run: npm run build

      # The seven PHP jobs run without Node, so they stub Vite — otherwise
      # every rendered page would fail on a missing manifest, and requiring a
      # frontend build to assert a database invariant is the wrong trade for a
      # platform deployed on shared cPanel hosting.
      #
      # A stub, though, renders a missing entry point exactly as happily as a
      # present one. This job has just produced a real manifest, so it is the
      # one place where the Blade template can be rendered against it for real.
      # It is deliberately narrow: the interface tests, once, not the suite.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Scoped by path, not by `--filter=Ui`: PHPUnit's filter is a
      # case-insensitive substring match, so `Ui` also selects `req-ui-res`,
      # `b-ui-lder` and `uu-i-d` — a near-arbitrary subset that would look like
      # a deliberate selection in the log.
      #
      # The manifest is asserted first. The test case falls back to a stubbed
      # Vite when the manifest is missing, so without this line a build that
      # produced nothing would still leave this step green while proving
      # nothing — the failure mode where silence reads as success.
      - name: Render the interface against the built manifest
        run: |
          test -f public/build/manifest.json \
            || { echo "No manifest: the build produced nothing to render against."; exit 1; }
          php artisan test tests/Feature/Ui
